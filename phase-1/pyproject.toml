[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-features"
version = "1.0.0"
description = "Reusable feature pipeline and anomaly detector for the Aura Workforce attrition project"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "joblib>=1.3", "openpyxl>=3.1",
]

[project.scripts]
aura-features = "src.features.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]
