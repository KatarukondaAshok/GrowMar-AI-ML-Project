[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-phase2"
version = "2.0.0"
description = "Aura Workforce Phase 2: payroll anomaly detector, reason codes, FastAPI service and HR chatbot"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "joblib>=1.3", "openpyxl>=3.1",
  "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pydantic>=2.6",
]

[tool.setuptools.packages.find]
include = ["src*", "app*", "mock_services*"]
