# Task 18: run the drift and fairness monitor every Monday and on demand. Uses the small extracts in phase-4/data/monitor (no secrets, no workbook).
name: cortexhr-monitor
on:
  schedule:
    - cron: "30 3 * * 1"      # Mondays 03:30 UTC
  workflow_dispatch: {}
jobs:
  monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase-4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: phase-4/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run monitor (exit code 2 means ALERT)
        run: python -m src.monitor.monitor | tee monitoring_report.txt
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: monitoring-report
          path: |
            phase-4/monitoring_report.txt
            phase-4/data/monitoring_latest.json
