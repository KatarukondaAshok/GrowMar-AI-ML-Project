[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-phase3"
version = "3.0.0"
description = "Aura Workforce Phase 3: resume ranking, fairness audit, attrition v2 with SHAP reasons, fair pay bands"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "joblib>=1.3", "openpyxl>=3.1",
  "lightgbm>=4.3", "shap>=0.45", "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
include = ["src*"]
